name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Build Microservices
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - product-service
          - user-service
          - order-service
          - inventory-service
          - notification-service
          - payment-service

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install Dependencies
        run: |
          cd services/${{ matrix.service }}
          npm ci

      - name: TypeScript Compile & Build
        run: |
          cd services/${{ matrix.service }}
          npm run build

      - name: Run Unit Tests
        run: |
          cd services/${{ matrix.service }}
          npm test

  docker-build-and-scan:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        service:
          - product-service
          - user-service
          - order-service
          - inventory-service
          - notification-service
          - payment-service

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        run: |
          docker build -t cloudcart/${{ matrix.service }}:${{ github.sha }} ./services/${{ matrix.service }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cloudcart/${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Render & Validate Manifests
        run: |
          kustomize build kubernetes/base > /dev/null
          echo "Kustomize manifests verified successfully!"
