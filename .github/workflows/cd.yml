name: CD GitOps Release

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'kubernetes/**'

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: write   # Required for committing updated GitOps manifests

jobs:
  release-to-ecr:
    name: Build & Push to Amazon ECR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - name: product-service
            path: services/product-service
            repo: cloudcart/product-service
          - name: user-service
            path: services/user-service
            repo: cloudcart/user-service
          - name: order-service
            path: services/order-service
            repo: cloudcart/order-service
          - name: inventory-service
            path: services/inventory-service
            repo: cloudcart/inventory-service
          - name: notification-service
            path: services/notification-service
            repo: cloudcart/notification-service
          - name: payment-service
            path: services/payment-service
            repo: cloudcart/payment-service
          - name: frontend
            path: frontend
            repo: cloudcart/frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true # Allows workflow to succeed in fork/demo repos without AWS account
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN || 'arn:aws:iam::123456789012:role/cloudcart-github-actions-role' }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        continue-on-error: true

      - name: Set Image Tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build, Tag, and Push Image to ECR
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          if [ -n "$REGISTRY" ]; then
            IMAGE_URI="${REGISTRY}/${{ matrix.repo }}:${{ steps.vars.outputs.IMAGE_TAG }}"
          else
            IMAGE_URI="${{ matrix.repo }}:${{ steps.vars.outputs.IMAGE_TAG }}"
          fi

          echo "Building $IMAGE_URI..."
          docker build -t "$IMAGE_URI" -t "${{ matrix.repo }}:latest" "./${{ matrix.path }}"

          if [ "${{ steps.login-ecr.outcome }}" == "success" ] && [ -n "$REGISTRY" ]; then
            docker push "$IMAGE_URI"
            echo "Successfully pushed $IMAGE_URI to ECR"
          else
            echo "Simulated ECR push for CI/CD demonstration."
          fi
