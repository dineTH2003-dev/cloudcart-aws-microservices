apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloudcart

resources:
  - namespace.yaml
  - ingress.yaml
  # Product Service
  - product/configmap.yaml
  - product/service.yaml
  - product/deployment.yaml
  - product/hpa.yaml
  # User Service
  - user/configmap.yaml
  - user/service.yaml
  - user/deployment.yaml
  - user/hpa.yaml
  # Order Service
  - order/configmap.yaml
  - order/service.yaml
  - order/deployment.yaml
  - order/hpa.yaml
  # Inventory Service
  - inventory/configmap.yaml
  - inventory/service.yaml
  - inventory/deployment.yaml
  # Notification Service
  - notification/configmap.yaml
  - notification/service.yaml
  - notification/deployment.yaml
  # Payment Service (ShopSphere Phase 3)
  - payment/configmap.yaml
  - payment/service.yaml
  - payment/deployment.yaml
  - payment/hpa.yaml
  # Frontend
  - frontend/service.yaml
  - frontend/deployment.yaml

images:
  - name: cloudcart/product-service
    newName: 265283365424.dkr.ecr.us-east-1.amazonaws.com/cloudcart/product-service
    newTag: latest
  - name: cloudcart/user-service
    newName: 265283365424.dkr.ecr.us-east-1.amazonaws.com/cloudcart/user-service
    newTag: latest
  - name: cloudcart/order-service
    newName: 265283365424.dkr.ecr.us-east-1.amazonaws.com/cloudcart/order-service
    newTag: latest
  - name: cloudcart/inventory-service
    newName: 265283365424.dkr.ecr.us-east-1.amazonaws.com/cloudcart/inventory-service
    newTag: latest
  - name: cloudcart/notification-service
    newName: 265283365424.dkr.ecr.us-east-1.amazonaws.com/cloudcart/notification-service
    newTag: latest
  - name: cloudcart/payment-service
    newName: 265283365424.dkr.ecr.us-east-1.amazonaws.com/cloudcart/payment-service
    newTag: latest
  - name: cloudcart/frontend
    newName: 265283365424.dkr.ecr.us-east-1.amazonaws.com/cloudcart/frontend
    newTag: latest
