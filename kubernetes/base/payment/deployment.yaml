apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: cloudcart
  labels:
    app: payment-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        tier: backend
    spec:
      containers:
        - name: payment-service
          image: 265283365424.dkr.ecr.us-east-1.amazonaws.com/cloudcart/payment-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8006
          env:
            - name: PORT
              value: "8006"
            - name: SERVICE_NAME
              value: payment-service
            - name: AWS_REGION
              value: us-east-1
          envFrom:
            - configMapRef:
                name: payment-service-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8006
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8006
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
