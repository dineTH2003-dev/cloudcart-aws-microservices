apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: cloudcart
  labels:
    app: product-service
    app.kubernetes.io/name: product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: cloudcart/product-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: product-service-config
          env:
            - name: DB_HOST
              value: "cloudcart-postgres-dev.cw7ksi4oaeod.us-east-1.rds.amazonaws.com"
            - name: DB_PASSWORD
              value: "ReplaceWithSecurePassword2026!"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 15
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
