apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudcart-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: cloudcart-dev
    environment: dev
spec:
  project: default
  source:
    repoURL: https://github.com/dineTH2003-dev/cloudcart-aws-microservices.git
    targetRevision: main
    path: kubernetes/base
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudcart
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
